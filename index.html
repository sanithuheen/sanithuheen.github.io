<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sanithu D. Heengama — Portfolio</title>
  <!-- Font Awesome for Logos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    /* Global Styles */
    :root {
      --primary-blue: #0044cc;
      --text-dark: #1a1a1a;
      --text-gray: #444;
      --border-light: #eeeeee;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      background-color: #ffffff;
      color: var(--text-dark);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 40px;
    }

    /* Header Layout: Avatar Left, Name/Info Right */
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 60px;
      padding: 80px 0;
    }

    /* Extra-Extra-Large Avatar with Liquid Blue Wave Animation */
    .avatar-wrap {
      width: 420px; /* Expanded frame size to view more image */
      height: 420px; 
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      border: 6px solid var(--primary-blue); /* Distinct blue border shade */
      /* Animation that morphs and eventually reveals the full asset */
      animation: blue-wave-reveal 10s infinite alternate ease-in-out;
    }

    .avatar {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Ensures image fills the 420px frame */
      display: block;
    }

    @keyframes blue-wave-reveal {
      0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
      50% { border-radius: 40% 60% 60% 40% / 60% 50% 50% 40%; }
      100% { border-radius: 50%; } /* Reverts to circle to show full image asset */
    }

    /* Header Text Column (Aligned Right of Avatar) */
    .header-info {
      flex: 1;
      text-align: left;
    }

    h1.name {
      font-family: "Georgia", serif;
      font-size: 3.2rem;
      margin: 0 0 10px 0;
      font-weight: 700;
    }

    .tagline {
      font-size: 1.35rem;
      color: var(--text-gray);
      margin-bottom: 25px;
      max-width: 650px;
    }

    .social-icon {
      font-size: 1.3rem;
      margin-right: 15px;
      color: var(--text-dark);
      text-decoration: none;
      transition: color 0.2s;
    }
    .social-icon:hover { color: var(--primary-blue); }

    /* Navigation Bar */
    .nav {
      border-top: 1px solid var(--border-light);
      border-bottom: 1px solid var(--border-light);
      padding: 20px 0;
      margin-bottom: 50px;
    }
    .nav a {
      margin-right: 35px;
      font-weight: 600;
      text-decoration: none;
      color: var(--text-dark);
    }
    .nav a:hover { color: var(--primary-blue); }

    /* Main Content Sections */
    .card { margin-bottom: 60px; }
    h2 { 
      font-family: "Georgia", serif; 
      font-size: 2rem; 
      border-bottom: 1px solid var(--border-light); 
      padding-bottom: 12px; 
      margin-bottom: 25px;
    }
    ul { list-style-type: square; padding-left: 20px; }
    li { margin-bottom: 15px; font-size: 1.05rem; }

    .btn {
      display: inline-block;
      padding: 12px 26px;
      background: #333;
      color: #fff !important;
      border-radius: 5px;
      text-decoration: none;
      margin-top: 20px;
      font-weight: 500;
    }
    .btn-outline {
      background: transparent;
      color: #333 !important;
      border: 1px solid #333;
      margin-left: 15px;
    }

    .site-footer {
      padding: 60px 0;
      font-size: 0.95rem;
      color: #888;
      border-top: 1px solid var(--border-light);
      margin-top: 40px;
    }
  </style>
</head>
